name: log_custom_printer
description: Custom logging for Dart with ANSI colors, JSON serialization, and get_it DI.
version: 3.4.1
repository: https://github.com/saulogatti/log_custom_printer

environment:
  sdk: ">=3.14.0 <4.0.0"

dependencies:
  get_it: ^9.3.0
  json_annotation: ^4.12.0
  meta: ^1.19.0
  path: ^1.9.1

dev_dependencies:
  build_runner: ^2.17.1
  test: ^1.33.0
  json_serializable: ^6.15.2
  lints: ^6.1.0
