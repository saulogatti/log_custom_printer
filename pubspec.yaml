name: log_custom_printer
description: Custom logging for Dart with ANSI colors, JSON serialization, and get_it DI.
version: 3.1.0
repository: https://github.com/saulogatti/log_custom_printer

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:

  get_it: ^9.2.1
  json_annotation: ^4.12.0
  meta: ^1.19.0
  path: ^1.9.1

dev_dependencies:
  build_runner: ^2.16.1
  test: ^1.32.0
  json_serializable: ^6.14.1
  lints: ^6.1.0
