dartdoc:
  # Define categories for organized API documentation
  categories:
    "Core":
      markdown: doc/Core.md
      displayName: "Core - Sistema de Logging"
    "Log Types":
      markdown: doc/LogTypes.md
      displayName: "Tipos de Log"
    "Printers":
      markdown: doc/Printers.md
      displayName: "Impressoras de Log"
    "Utilities":
      markdown: doc/Utilities.md
      displayName: "Utilitários"
    "Configuration":
      markdown: doc/Configuration.md
      displayName: "Configuração"
    "Console View":
      markdown: doc/ConsoleView.md
      displayName: "Console Visual de Logs"

  # Category display order
  categoryOrder: ["Core", "Log Types", "Printers", "Configuration", "Query", "Utilities", "Console View"]

  # Show categories that are not documented explicitly
  showUndocumentedCategories: true

  # Warnings and errors to ignore
  ignore:
    - ambiguous-doc-reference

  # Errors to report
  errors:
    - unresolved-doc-reference

  # Warnings to report
  warnings:
    - tool-error
    - unresolved-export

  # Output settings
  output: doc/api

  # Include source code links
  linkToSource:
    root: "."
    uriTemplate: "https://github.com/saulogatti/log_custom_printer/blob/main/%f%#L%l%"

  # Exclude generated files from documentation
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

  # Project metadata
  nodoc:
    - "package:log_custom_printer/src/data/cache/**"
